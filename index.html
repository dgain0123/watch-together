<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一起看 YouTube</title>
<style>
  :root { --bg:#111; --card:#1d1d1f; --fg:#f2f2f2; --muted:#9a9a9a; --accent:#ff3b30; --ok:#34c759; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:14px; }
  .row { display:flex; gap:8px; }
  input { flex:1; min-width:0; font-size:16px; padding:12px; border-radius:10px; border:1px solid #333; background:#000; color:var(--fg); }
  button { font-size:16px; padding:12px 16px; border-radius:10px; border:0; background:var(--accent); color:#fff; font-weight:600; }
  button.secondary { background:#333; }
  .player-wrap { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .player-wrap > div, .player-wrap iframe { position:absolute; inset:0; width:100%; height:100%; }
  .shield { position:absolute; inset:0; z-index:2; }
  #qr { background:#fff; padding:12px; border-radius:12px; width:fit-content; margin:8px auto; }
  #qr img, #qr canvas { display:block; width:220px; height:220px; }
  .link { word-break:break-all; color:var(--muted); font-size:13px; text-align:center; }
  .status { font-size:14px; color:var(--muted); margin:8px 0 0; }
  .status b { color:var(--ok); font-weight:600; }
  .hint { font-size:13px; color:var(--muted); line-height:1.6; }
  #tap { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:24px; }
  #tap button { font-size:22px; padding:18px 32px; border-radius:16px; }
  .hidden { display:none !important; }
  .fs-btn { width:100%; margin-top:10px; background:#333; }
  #fsExit { position:absolute; top:10px; right:10px; z-index:3; padding:8px 14px; font-size:15px; background:rgba(0,0,0,.55); display:none; }
  /* 全螢幕：鋪滿畫面；直拿手機時把影片轉 90 度 */
  body.fs { overflow:hidden; }
  body.fs #viewerWrap { position:fixed; z-index:20; border-radius:0; aspect-ratio:auto; top:0; left:0; width:100vw; height:100dvh; }
  body.fs #fsExit { display:block; }
  @media (orientation: portrait) {
    body.fs #viewerWrap { width:100dvh; height:100vw; top:50%; left:50%; transform:translate(-50%,-50%) rotate(90deg); }
  }
</style>
</head>
<body>
<main>
  <!-- 主持人畫面 -->
  <section id="host" class="hidden">
    <h1>一起看 YouTube（主持人）</h1>
    <div class="card">
      <div class="row">
        <input id="url" placeholder="貼上 YouTube 影片連結" autocomplete="off">
        <button id="go">播放</button>
      </div>
      <p class="status" id="hostStatus">連線中…</p>
    </div>
    <div class="card">
      <div class="player-wrap"><div id="hostPlayer"></div></div>
      <p class="hint">直接在影片上按播放、暫停、拖進度條，大家的手機都會跟著動。</p>
    </div>
    <div class="card">
      <div class="hint" style="text-align:center">請大家用手機相機掃這個 QR code</div>
      <div id="qr"></div>
      <div class="link" id="joinLink"></div>
      <div class="row" style="justify-content:center;margin-top:10px">
        <button class="secondary" id="copy">複製連結</button>
        <button class="secondary" id="newRoom">換一個新房間</button>
      </div>
    </div>
  </section>

  <!-- 觀眾畫面 -->
  <section id="viewer" class="hidden">
    <h1>一起看 YouTube</h1>
    <div class="player-wrap" id="viewerWrap"><div id="viewerPlayer"></div><div class="shield"></div><button id="fsExit">✕ 離開全螢幕</button></div>
    <button class="fs-btn" id="fsBtn">⛶ 全螢幕觀看</button>
    <p class="status" id="viewerStatus">連線中…</p>
    <p class="hint">影片由主持人控制，會自動跟主持人同步。按「全螢幕觀看」可以滿版看。</p>
  </section>
</main>

<div id="tap" class="hidden">
  <div style="font-size:18px">準備好了嗎？</div>
  <button id="tapBtn">點我開始觀看</button>
  <div class="hint">手機規定要先點一下才能放出聲音</div>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  // 兩台公開訊息伺服器同時連，一台掛了另一台還能用
  const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
  const PREFIX = 'dgain0123-watch-together/v1/';

  const params = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  const safeGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const randId = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');

  // ---------- 訊息連線 ----------
  function connectAll(room, onMsg, onStatus) {
    const clients = BROKERS.map(url => {
      const c = mqtt.connect(url, { clientId: 'wt_' + randId(10), reconnectPeriod: 2000, connectTimeout: 8000, clean: true });
      c.on('connect', () => { c.subscribe(PREFIX + room + '/#'); onStatus(); });
      c.on('close', onStatus);
      c.on('message', (topic, payload, packet) => {
        try { onMsg(topic.slice((PREFIX + room + '/').length), JSON.parse(payload.toString()), packet.retain); } catch {}
      });
      return c;
    });
    return {
      publish(sub, obj, retain) {
        const s = JSON.stringify(obj);
        clients.forEach(c => c.connected && c.publish(PREFIX + room + '/' + sub, s, { qos: 0, retain: !!retain }));
      },
      connectedCount: () => clients.filter(c => c.connected).length,
    };
  }

  // ---------- YouTube ----------
  function parseVideoId(text) {
    text = (text || '').trim();
    if (/^[\w-]{11}$/.test(text)) return text;
    const m = text.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/live\/|\/embed\/)([\w-]{11})/);
    return m ? m[1] : null;
  }
  const ytReady = new Promise(res => { window.onYouTubeIframeAPIReady = res; });
  const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
  const playerVars = { playsinline: 1, rel: 0, modestbranding: 1 };

  // ---------- 準確的播放位置 ----------
  // YouTube 回報的時間每隔一小段才更新一次（會落後）。連續取樣，取「最不落後」的那筆推算現在的位置。
  function makePosEstimator(getPlayer) {
    let samples = [], lastKey = '';
    setInterval(() => {
      const p = getPlayer(); if (!p || !p.getCurrentTime || !p.getPlayerState) return;
      const st = p.getPlayerState(), rate = p.getPlaybackRate(), ct = p.getCurrentTime(), now = Date.now();
      const key = st + '|' + rate;
      if (key !== lastKey || st !== 1) { samples = []; lastKey = key; }
      if (st !== 1) return;
      const last = samples[samples.length - 1];
      if (last && Math.abs((ct - last[1]) - (now - last[0]) / 1000 * rate) > 0.5) samples = []; // 跳過進度
      samples.push([now, ct, rate]);
      while (now - samples[0][0] > 1500) samples.shift();
    }, 25);
    return () => {
      const p = getPlayer(), now = Date.now(), ct = p.getCurrentTime();
      if (p.getPlayerState() !== 1 || samples.length < 3) return { t: ct, good: false };
      let best = -Infinity;
      for (const [n, c, r] of samples) best = Math.max(best, c - n / 1000 * r);
      return { t: best + now / 1000 * samples[0][2], good: now - samples[0][0] > 700 };
    };
  }

  // ================= 主持人 =================
  function startHost(room) {
    $('host').classList.remove('hidden');
    const joinUrl = location.origin + location.pathname + '?room=' + room;
    $('joinLink').textContent = joinUrl;
    new QRCode($('qr'), { text: joinUrl, width: 440, height: 440, correctLevel: QRCode.CorrectLevel.M });
    $('copy').onclick = async () => {
      try { await navigator.clipboard.writeText(joinUrl); $('copy').textContent = '已複製'; } catch { prompt('複製這個連結', joinUrl); }
      setTimeout(() => $('copy').textContent = '複製連結', 1500);
    };
    $('newRoom').onclick = () => { if (confirm('換新房間後，舊的 QR code 會失效，確定嗎？')) { const r = randId(6); safeSet('wt_host_room', r); location.search = '?host=' + r; } };

    const viewers = new Map(); // 觀眾 id → 最後回報時間
    let player = null, videoId = null;

    const net = connectAll(room, (sub, msg) => {
      if (sub === 'hello' && msg.id) viewers.set(msg.id, Date.now());
      if (sub === 'ping' && msg.id) net.publish('pong/' + msg.id, { t0: msg.t0, th: Date.now() }); // 讓觀眾對時
    }, refreshStatus);

    function refreshStatus() {
      const now = Date.now();
      for (const [id, t] of viewers) if (now - t > 12000) viewers.delete(id);
      const ok = net && net.connectedCount() > 0;
      $('hostStatus').innerHTML = ok ? `<b>已連線</b>　目前有 ${viewers.size} 人在看` : '連線中…（如果一直連不上，請檢查網路）';
    }
    setInterval(refreshStatus, 3000);

    const pos = makePosEstimator(() => player);
    function sendState() {
      if (!player || !videoId || !player.getCurrentTime) return;
      const st = player.getPlayerState();
      const playing = st === YT.PlayerState.PLAYING;
      const p = pos();
      // 緩衝中＝主持人那邊畫面停住，觀眾也先停在同一格
      net.publish('state', { v: videoId, s: playing ? 'play' : 'pause', t: p.t, g: p.good, r: player.getPlaybackRate(), ts: Date.now() }, true);
    }
    setInterval(sendState, 500);

    ytReady.then(() => {
      player = new YT.Player('hostPlayer', {
        playerVars,
        events: {
          onReady: () => {
            const last = safeGet('wt_host_video');
            if (last) { videoId = last; player.cueVideoById(last); $('url').value = 'https://youtu.be/' + last; }
          },
          onStateChange: sendState,
          onPlaybackRateChange: sendState,
        },
      });
    });

    function go() {
      const id = parseVideoId($('url').value);
      if (!id) { alert('看不懂這個連結，請貼 YouTube 影片的網址'); return; }
      videoId = id; safeSet('wt_host_video', id);
      player.loadVideoById(id);
      sendState();
    }
    $('go').onclick = go;
    $('url').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }

  // ================= 觀眾 =================
  function startViewer(room) {
    $('viewer').classList.remove('hidden');
    $('tap').classList.remove('hidden');
    const myId = randId(8);
    let player = null, playerReady = false, unlocked = false, state = null, lastTs = 0;

    // --- 對時：問主持人「你現在幾點」，取來回最快的那次算時鐘差 ---
    const pongs = [];
    let clockOffset = null; // 主持人時鐘 − 我的時鐘（毫秒）
    const offsets = [];     // 對時還沒好之前的備用估法
    let pingCount = 0;
    function ping() { net.publish('ping', { id: myId, t0: Date.now() }); pingCount++; setTimeout(ping, pingCount < 15 ? 1000 : 5000); }

    const net = connectAll(room, (sub, msg, retained) => {
      if (sub === 'pong/' + myId) {
        const t1 = Date.now(), rtt = t1 - msg.t0;
        pongs.push({ rtt, off: msg.th - (msg.t0 + t1) / 2 }); if (pongs.length > 30) pongs.shift();
        clockOffset = pongs.reduce((a, b) => (b.rtt < a.rtt ? b : a)).off;
        return;
      }
      if (sub !== 'state' || !msg.v || msg.ts <= lastTs) return;
      lastTs = msg.ts;
      if (!retained) { offsets.push(msg.ts - Date.now()); if (offsets.length > 30) offsets.shift(); }
      state = msg;
      onState();
    }, refreshStatus);
    setInterval(() => net.publish('hello', { id: myId }), 5000);
    net.publish('hello', { id: myId });
    setTimeout(ping, 500);

    function refreshStatus() {
      const ok = net && net.connectedCount() > 0;
      $('viewerStatus').innerHTML = !ok ? '連線中…' : state ? '<b>已連線</b>　跟主持人同步中' : '<b>已連線</b>　等主持人選影片…';
    }

    const hostNow = () => Date.now() + (clockOffset ?? (offsets.length ? Math.max(...offsets) + 50 : 0));
    // 主持人「現在」播到哪
    function wantTime() {
      if (state.s !== 'play') return state.t;
      return state.t + Math.max(0, hostNow() - state.ts) / 1000 * (state.r || 1);
    }

    let loadedId = null;
    function onState() {
      refreshStatus();
      if (!state || !playerReady || loadedId === state.v) return;
      loadedId = state.v;
      if (unlocked) player.loadVideoById(state.v, wantTime()); else player.cueVideoById(state.v, wantTime());
    }

    // --- 每 0.2 秒校正一次：差很多就跳過去，差一點就微調速度追上 ---
    const pos = makePosEstimator(() => player);
    let busyUntil = 0, correcting = null, seekLead = 0.2, checkLead = false;
    function nearestRate(target, base) {
      const list = (player.getAvailablePlaybackRates && player.getAvailablePlaybackRates()) || [];
      let best = null;
      for (const r of list) if (r !== base && (best === null || Math.abs(r - target) < Math.abs(best - target))) best = r;
      return best;
    }
    setInterval(() => {
      if (!state || !playerReady || !unlocked || loadedId !== state.v) return;
      const now = Date.now(), base = state.r || 1;
      if (correcting || now < busyUntil) return;
      if (player.getPlaybackRate() !== base) { player.setPlaybackRate(base); busyUntil = now + 900; return; }
      const st = player.getPlayerState();
      if (state.s !== 'play') {
        if (st === 1 || st === 3) player.pauseVideo();
        if (Math.abs(player.getCurrentTime() - state.t) > 0.04) player.seekTo(state.t, true);
        busyUntil = now + 300; return;
      }
      if (st !== 1 && st !== 3) { player.seekTo(wantTime() + seekLead, true); player.playVideo(); checkLead = true; busyUntil = now + 1500; return; }
      if (st === 3) return; // 緩衝中
      const p = pos();
      if (!p.good) return;
      const d = p.t - wantTime(); // 正＝我比主持人快
      if (checkLead) { seekLead = Math.min(2, Math.max(0, seekLead - d)); checkLead = false; } // 學習跳轉要提前多少
      if (Math.abs(d) > 1) { player.seekTo(wantTime() + seekLead, true); checkLead = true; busyUntil = now + 1500; return; }
      if (Math.abs(d) < 0.03 || clockOffset === null || state.g === false) return;
      const r = nearestRate(base * (d > 0 ? 0.9 : 1.1), base);
      if (r === null || (d > 0) !== (r < base)) return;
      player.setPlaybackRate(r);
      correcting = true;
      setTimeout(() => { player.setPlaybackRate(base); correcting = false; busyUntil = Date.now() + 900; },
                 Math.min(4000, Math.abs(d) / Math.abs(r - base) * 1000));
    }, 200);

    ytReady.then(() => {
      player = new YT.Player('viewerPlayer', {
        playerVars: { ...playerVars, controls: 0, disablekb: 1 },
        events: { onReady: () => { playerReady = true; if (unlocked) { player.unMute(); player.setVolume(100); } onState(); } },
      });
    });

    // 全螢幕：Android 用真的全螢幕＋鎖橫向；iPhone 不支援，就用畫面鋪滿＋旋轉
    const root = document.documentElement;
    const isFs = () => document.fullscreenElement || document.webkitFullscreenElement;
    $('fsBtn').onclick = async () => {
      document.body.classList.add('fs');
      try {
        if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: 'hide' });
        else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
      } catch {}
    };
    $('fsExit').onclick = () => {
      document.body.classList.remove('fs');
      try { if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch {}
    };
    const onFsChange = () => { if (!isFs()) document.body.classList.remove('fs'); };
    document.addEventListener('fullscreenchange', onFsChange);
    document.addEventListener('webkitfullscreenchange', onFsChange);

    $('tapBtn').onclick = () => {
      $('tap').classList.add('hidden');
      unlocked = true;
      if (playerReady) {
        // 在使用者點擊的這一刻先播一下，之後手機才允許自動播放有聲音
        player.unMute(); player.setVolume(100); player.playVideo();
      }
    };
  }

  // ---------- 入口 ----------
  if (params.get('room')) {
    startViewer(params.get('room'));
  } else {
    let room = params.get('host') || safeGet('wt_host_room');
    if (!room) room = randId(6);
    safeSet('wt_host_room', room);
    if (params.get('host') !== room) history.replaceState(null, '', '?host=' + room);
    startHost(room);
  }
})();
</script>
</body>
</html>
